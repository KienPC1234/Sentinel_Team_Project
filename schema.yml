components:
  schemas:
    ActionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    CategoryEnum:
      enum:
      - warning
      - discussion
      - experience
      - question
      type: string
      description: |-
        * `warning` - Cảnh báo
        * `discussion` - Thảo luận
        * `experience` - Kinh nghiệm
        * `question` - Hỏi đáp
    ChatAIRequestRequest:
      type: object
      properties:
        user_message:
          type: string
          minLength: 1
        session_id:
          type: string
          format: uuid
        context:
          type: string
          minLength: 1
          default: general
        images:
          type: array
          items:
            type: string
            minLength: 1
          default: []
      required:
      - session_id
      - user_message
    ChatFolder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    ChatFolderRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    ChatSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        folder:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
    ChatbotConfig:
      type: object
      properties:
        tone:
          $ref: '#/components/schemas/ToneEnum'
        tone_display:
          type: string
          readOnly: true
        language_style:
          $ref: '#/components/schemas/LanguageStyleEnum'
        language_style_display:
          type: string
          readOnly: true
        custom_name:
          type: string
          description: Custom name for the AI assistant
          maxLength: 50
        custom_instructions:
          type: string
          description: Additional instructions for the AI
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - language_style_display
      - tone_display
      - updated_at
    ChatbotConfigRequest:
      type: object
      properties:
        tone:
          $ref: '#/components/schemas/ToneEnum'
        language_style:
          $ref: '#/components/schemas/LanguageStyleEnum'
        custom_name:
          type: string
          description: Custom name for the AI assistant
          maxLength: 50
        custom_instructions:
          type: string
          description: Additional instructions for the AI
    EditorImageUploadRequestRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
        file:
          type: string
          format: binary
        upload:
          type: string
          format: binary
    EditorImageUploadResponse:
      type: object
      properties:
        success:
          type: integer
        url:
          type: string
        path:
          type: string
        file:
          type: object
          additionalProperties: {}
      required:
      - file
      - path
      - success
      - url
    EditorMediaDeleteResponse:
      type: object
      properties:
        success:
          type: integer
      required:
      - success
    EditorMediaLibraryResponse:
      type: object
      properties:
        success:
          type: integer
        items:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - items
      - success
    ForumPost:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author_name:
          type: string
          readOnly: true
        author_username:
          type: string
          readOnly: true
        author_is_staff:
          type: boolean
          readOnly: true
        author_avatar:
          type: string
          format: uri
          nullable: true
          readOnly: true
        author_rank:
          type: string
          readOnly: true
        author_posts_count:
          type: string
          readOnly: true
        author_comments_count:
          type: string
          readOnly: true
        author_joined:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 300
        content:
          type: string
        category:
          $ref: '#/components/schemas/CategoryEnum'
        image:
          type: string
          format: uri
          nullable: true
        views_count:
          type: integer
          readOnly: true
        unique_views_count:
          type: string
          readOnly: true
        likes_count:
          type: integer
          readOnly: true
        helpful_count:
          type: integer
          readOnly: true
        shares_count:
          type: integer
          readOnly: true
        dislikes_count:
          type: integer
          readOnly: true
        reports_count:
          type: integer
          readOnly: true
        comments_count:
          type: integer
          readOnly: true
        is_pinned:
          type: boolean
        is_locked:
          type: boolean
        user_liked:
          type: string
          readOnly: true
        user_helpful:
          type: string
          readOnly: true
        user_shared:
          type: string
          readOnly: true
        user_disliked:
          type: string
          readOnly: true
        comments:
          type: string
          readOnly: true
        last_comment_author:
          type: string
          readOnly: true
        last_comment_at:
          type: string
          readOnly: true
        scan_reference:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author_avatar
      - author_comments_count
      - author_is_staff
      - author_joined
      - author_name
      - author_posts_count
      - author_rank
      - author_username
      - comments
      - comments_count
      - content
      - created_at
      - dislikes_count
      - helpful_count
      - id
      - last_comment_at
      - last_comment_author
      - likes_count
      - reports_count
      - scan_reference
      - shares_count
      - title
      - unique_views_count
      - user_disliked
      - user_helpful
      - user_liked
      - user_shared
      - views_count
    GenderEnum:
      enum:
      - male
      - female
      - non_binary
      - transgender
      - gender_fluid
      - bigender
      - genderqueer
      - agender
      - intersex
      - other
      - prefer_not_to_say
      type: string
      description: |-
        * `male` - Nam
        * `female` - Nữ
        * `non_binary` - Phi nhị nguyên giới (Non-binary)
        * `transgender` - Người chuyển giới (Transgender)
        * `gender_fluid` - Linh hoạt giới (Genderfluid)
        * `bigender` - Song giới (Bigender)
        * `genderqueer` - Giới phi chuẩn (Genderqueer)
        * `agender` - Vô giới (Agender)
        * `intersex` - Liên giới tính (Intersex)
        * `other` - Khác
        * `prefer_not_to_say` - Tôi không muốn tiết lộ
    LanguageStyleEnum:
      enum:
      - simple
      - detailed
      - concise
      type: string
      description: |-
        * `simple` - Đơn giản, dễ hiểu
        * `detailed` - Chi tiết, chuyên sâu
        * `concise` - Ngắn gọn, súc tích
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    PatchedChatFolderRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    PatchedUserProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 100
        gender:
          $ref: '#/components/schemas/GenderEnum'
        avatar:
          type: string
          format: binary
          nullable: true
        bio:
          type: string
          maxLength: 500
        about:
          type: string
          description: Markdown supported bio/about section
        messenger_link:
          type: string
          nullable: true
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
        full_name:
          type: string
          minLength: 1
          default: ''
          maxLength: 150
        first_name:
          type: string
          minLength: 1
          default: ''
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          default: ''
          maxLength: 150
      required:
      - email
      - password
    ReportCreateRequest:
      type: object
      properties:
        target_type:
          $ref: '#/components/schemas/TargetTypeEnum'
        target_value:
          type: string
          minLength: 1
          description: 'Normalized: phone number, domain, account info'
          maxLength: 500
        scam_type:
          $ref: '#/components/schemas/ScamTypeEnum'
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        description:
          type: string
          minLength: 1
        evidence_file:
          type: string
          format: binary
          nullable: true
        scammer_phone:
          type: string
          maxLength: 20
        scammer_bank_account:
          type: string
          maxLength: 50
        scammer_bank_name:
          type: string
          maxLength: 100
        scammer_name:
          type: string
          maxLength: 200
        ocr_text:
          type: string
          description: Text extracted from evidence_file via OCR
        ai_analysis:
          description: AI analysis of the report and OCR text
      required:
      - description
      - scam_type
      - target_type
      - target_value
    ReportDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        target_type:
          $ref: '#/components/schemas/TargetTypeEnum'
        target_value:
          type: string
          description: 'Normalized: phone number, domain, account info'
          maxLength: 500
        scam_type:
          $ref: '#/components/schemas/ScamTypeEnum'
        scam_type_display:
          type: string
          readOnly: true
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        description:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        reporter_email:
          type: string
          readOnly: true
        scammer_name:
          type: string
          maxLength: 200
        scammer_phone:
