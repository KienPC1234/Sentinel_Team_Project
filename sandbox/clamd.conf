LocalSocket /var/run/clamav/clamd.ctl
FixStaleSocket true
LocalSocketGroup sandboxuser
LocalSocketMode 666
User sandboxuser
DatabaseDirectory /var/lib/clamav
LogSyslog false
LogVerbose false
ScanPE true
ScanELF true
ScanOLE2 true
ScanPDF true
ScanSWF true
ScanArchive true
MaxScanSize 100M
MaxFileSize 25M
MaxRecursion 16
MaxFiles 10000

